# Multi-network layout (branch: multi-network)
#
# - payment-service      -> s2s-payment-network only
# - notification-service -> s2s-notification-network only
# - order-service        -> s2s-order-network (home) + payment & notification nets for calls
# - istiod               -> Kind cluster; sidecars use extra_hosts (not a Docker network)

services:
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "4000:4000"
    networks:
      payment-network:
        aliases:
          - payment-service
    extra_hosts:
      - "istiod.istio-system.svc:host-gateway"
    cap_add:
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined

  payment-istio:
    image: istio/proxyv2:1.31.0
    command: proxy
    depends_on:
      - payment-service
    network_mode: service:payment-service
    cap_add:
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./istio/workloads/payment-config/cluster.env:/var/lib/istio/envoy/cluster.env:ro
      - ./istio/workloads/payment-config/mesh.yaml:/etc/istio/config/mesh:ro
      - ./istio/workloads/payment-config/root-cert.pem:/var/run/secrets/istio/root-cert.pem:ro
      - ./istio/workloads/payment-config/istio-token:/var/run/secrets/tokens/istio-token:ro

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "5001:5000"
    networks:
      notification-network:
        aliases:
          - notification-service
    extra_hosts:
      - "istiod.istio-system.svc:host-gateway"
    cap_add:
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined

  notification-istio:
    image: istio/proxyv2:1.31.0
    command: proxy
    depends_on:
      - notification-service
    network_mode: service:notification-service
    cap_add:
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./istio/workloads/notification-config/cluster.env:/var/lib/istio/envoy/cluster.env:ro
      - ./istio/workloads/notification-config/mesh.yaml:/etc/istio/config/mesh:ro
      - ./istio/workloads/notification-config/root-cert.pem:/var/run/secrets/istio/root-cert.pem:ro
      - ./istio/workloads/notification-config/istio-token:/var/run/secrets/tokens/istio-token:ro

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "3000:3000"
    networks:
      order-network:
        aliases:
          - order-service
      payment-network:
      notification-network:
    extra_hosts:
      - "istiod.istio-system.svc:host-gateway"
    cap_add:
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
    depends_on:
      - payment-service
      - notification-service

  order-istio:
    image: istio/proxyv2:1.31.0
    command: proxy
    depends_on:
      - order-service
    network_mode: service:order-service
    cap_add:
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./istio/workloads/order-config/cluster.env:/var/lib/istio/envoy/cluster.env:ro
      - ./istio/workloads/order-config/mesh.yaml:/etc/istio/config/mesh:ro
      - ./istio/workloads/order-config/root-cert.pem:/var/run/secrets/istio/root-cert.pem:ro
      - ./istio/workloads/order-config/istio-token:/var/run/secrets/tokens/istio-token:ro

networks:
  order-network:
    name: s2s-order-network
    driver: bridge
  payment-network:
    name: s2s-payment-network
    driver: bridge
  notification-network:
    name: s2s-notification-network
    driver: bridge
