# Inbound response headers added by the sidecar (no application code changes).
# Verify: curl -i http://localhost:4000/payments/x  (look for x-app, x-instance-id)
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: inbound-headers-order
  namespace: mesh-workloads
spec:
  workloadSelector:
    labels:
      app: order
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
      patch:
        operation: INSERT_FIRST
        value:
          name: envoy.filters.http.lua.order-headers
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inlineCode: |
              function envoy_on_response(handle)
                handle:headers():add("x-app", "order")
                handle:headers():add("x-instance-id", os.getenv("HOSTNAME") or "unknown")
              end
