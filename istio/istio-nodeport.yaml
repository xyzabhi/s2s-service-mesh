apiVersion: install.istio.io/v1alpha1
kind: IstioOperator

spec:
  # minimal = istiod only (fewer images; better on locked-down laptops)
  profile: minimal
  hub: docker.io/istio
  tag: 1.31.0
  values:
    global:
      imagePullPolicy: IfNotPresent

  components:
    pilot:
      k8s:
        service:
          type: NodePort
          ports:
            - name: grpc-xds
              port: 15010
              targetPort: 15010
            - name: https-dns
              port: 15012
              targetPort: 15012
              nodePort: 31215